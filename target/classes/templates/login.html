<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<div class="container auth">
    <div class="card">
        <h2 th:text="'Sign in to ' + ${siteName}">Sign in</h2>
        <div th:replace="~{fragments :: flash}"></div>
        <div th:if="${param.error}" class="alert err">Invalid email or password, or the account is disabled.</div>
        <div th:if="${param.logout}" class="alert ok">You have been signed out.</div>
        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input id="username" type="email" name="username" required autofocus style="width:100%">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required style="width:100%">
            <p><button class="btn" type="submit">Sign in</button></p>
        </form>
        <p class="muted">New here? <a th:href="@{/register}">Create an account</a></p>
        <p class="muted">Demo logins: admin@fitcoach.com / admin123, coach@fitcoach.com / coach123,
            user@fitcoach.com / user123</p>
    </div>
</div>
</body>
</html>
